[project]
name = "data"
version = "0.1.0"
description = "林草知识库问答 MVP"
readme = "README.md"
authors = [
    { name = "love", email = "2292647987@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "pyjwt>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["app", "scripts", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
